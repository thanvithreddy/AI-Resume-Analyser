services:
  - type: web
    name: resume-analyzer-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/resume-analyzer-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
