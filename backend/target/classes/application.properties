spring.application.name=resume-analyzer

# Database (Neon PostgreSQL - user fills this)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/resumeai}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET:your-very-secret-key-change-this-in-production-minimum-256-bits}
app.jwt.expiration=86400000

# Gemini API
app.gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://your-vercel-app.vercel.app}

# Server
server.port=${PORT:8080}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
